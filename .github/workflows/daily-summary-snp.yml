name: Daily SNP CI Summary

on:
  schedule:
    # Run at 12 PM, 2 PM, and 4 PM UTC (4 AM, 6 AM, 8 AM PST)
    # This is after the previous night's CI run completes (~7 AM UTC / 11 PM PST)
    # Send once per day - first successful attempt wins
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'

  workflow_dispatch:
    # Manual trigger for testing
    inputs:
      force:
        description: 'Force send both kata & trustee summaries even if already sent today'
        type: boolean
        default: false

jobs:
  daily-summary-kata-snp:
    uses: ./.github/workflows/reusable-daily-summary.yml
    with:
      job_label: 'SNP'
      job_repo: 'kata-containers'
      nightly_workflow_api_path: 'repos/kata-containers/kata-containers/actions/workflows/ci-nightly.yaml/runs'
      test_filter_pattern: 'sev-snp|qemu-snp'
      test_exclude_pattern: 'experimental'
      notification_header: 'AMD SEV-SNP Nightly Kata CI Results'
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_SNP }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  daily-summary-trustee-snp:
    uses: ./.github/workflows/reusable-daily-summary.yml
    with:
      job_label: 'SNP'
      job_repo: 'trustee'
      nightly_workflow_api_path: 'repos/confidential-containers/trustee/actions/workflows/test-e2e-helm-nightly.yml/runs'
      test_filter_pattern: '\(SNP\)'
      test_exclude_pattern: 'experimental'
      notification_header: 'AMD SEV-SNP Nightly Trustee CI Results'
      force: ${{ github.event.inputs.force == 'true' }}
    secrets: 
      slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL_SNP }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}
